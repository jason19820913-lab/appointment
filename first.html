<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>金鶯診所初診單</title>
<meta name="description" content="金鶯診所初診單：健保複診線上預約、查詢與取消。">
<meta property="og:title" content="金鶯診所初診單">
<meta property="og:description" content="第一次到金鶯診所看診的民眾，請先填寫線上初診單；從 LINE 開啟可一併完成 LINE 綁定。">
<meta property="og:image" content="https://jason19820913-lab.github.io/drking/logo.png">
<meta property="og:type" content="website">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--pri:#1F4D45;--pri2:#173B35;--teal:#1E6F63;--teal-l:#E3F0EC;--bg:#F1F5F2;--tx:#1B2B26;--mut:#6B7C75;--line:#DCE5E0;--amb:#B7791F;--amb-l:#FBE9C7;--red:#C0392B;--red-l:#FDEDEB;--ok:#1E7F5C}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans TC",-apple-system,"PingFang TC",sans-serif;-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer}input,select,textarea{font-family:inherit;font-size:16px;color:var(--tx)}
.hidden{display:none!important}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 40px}
.top{display:flex;align-items:center;gap:10px;padding:6px 0 14px}.top img{width:40px;height:40px;border-radius:12px}.top b{font-size:17px}.top small{display:block;color:var(--mut);font-size:12px}
.card{background:#fff;border-radius:18px;padding:22px 18px;box-shadow:0 6px 24px rgba(0,0,0,.06);margin-bottom:14px}
.hero{background:linear-gradient(135deg,#1F4D45,#2E7D6E);color:#fff;border-radius:18px;padding:26px 20px;margin-bottom:14px}
.hero .tag{display:inline-block;background:#FBE9C7;color:#7A4F0C;font-weight:700;border-radius:999px;padding:4px 12px;font-size:13px;margin-bottom:10px}
.hero h1{margin:0 0 8px;font-size:24px}.hero p{margin:0;font-size:14px;line-height:1.7;opacity:.92}
.btn{display:block;width:100%;border:none;border-radius:12px;padding:15px;font-size:17px;font-weight:700;background:var(--pri);color:#fff}
.btn:disabled{opacity:.5}.btn.sec{background:#fff;color:var(--pri);border:2px solid var(--pri)}.btn.amb{background:var(--amb)}.btn+.btn{margin-top:10px}
.fld{margin-bottom:14px}.fld label{display:block;font-size:14px;color:var(--mut);margin-bottom:6px}.fld label b{color:var(--red)}
.fld input,.fld select,.fld textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(30,111,99,.15)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:8px}.seg button{flex:1;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:15px}.seg button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.hint{font-size:13px;color:var(--mut);line-height:1.6}
.err{background:var(--red-l);color:var(--red);border-radius:10px;padding:10px 12px;font-size:14px;margin:10px 0;line-height:1.6}
.note{background:var(--amb-l);color:#7A4F0C;border-radius:10px;padding:10px 12px;font-size:14px;margin:10px 0;line-height:1.6}
.okbox{background:var(--teal-l);color:var(--pri);border-radius:10px;padding:12px;font-size:14px;line-height:1.7}
h2{font-size:18px;margin:0 0 14px}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.day{flex:0 0 auto;width:68px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px 4px;text-align:center}
.day b{display:block;font-size:17px}.day small{display:block;color:var(--mut);font-size:12px}.day.on{background:var(--pri);color:#fff;border-color:var(--pri)}.day.on small{color:#D6E7E2}.day.off{opacity:.35}
.slots{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.slot{border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px 4px;text-align:center}.slot b{display:block;font-size:15px}.slot small{display:block;color:var(--mut);font-size:12px}
.slot.on{background:var(--pri);color:#fff;border-color:var(--pri)}.slot.on small{color:#D6E7E2}.slot.full{opacity:.4}
.kv{display:grid;grid-template-columns:84px 1fr;gap:8px 10px;font-size:15px;margin:12px 0}.kv span{color:var(--mut)}.kv b{font-weight:600}
.link{display:block;text-align:center;color:var(--teal);font-size:14px;margin-top:14px;text-decoration:none}
.foot{text-align:center;color:#9AA8A2;font-size:12px;margin-top:20px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px;margin-right:6px}@keyframes sp{to{transform:rotate(360deg)}}
.hp{position:absolute;left:-9999px;opacity:0;height:0}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><img src="https://jason19820913-lab.github.io/drking/logo.png" alt="" onerror="this.style.display='none'"><div><b>金鶯診所 初診單</b><small>第一次到本院看診請先填寫</small></div></div>

  <div id="v-form">
    <div class="card" style="padding:12px 16px;margin-bottom:12px"><div class="hint" id="liff-state">正在連線 LINE…</div><div id="notice" class="hint hidden"></div></div>
    <form class="card" id="b-form" autocomplete="on" onsubmit="return false"><h2>初診單</h2>
      <div id="ff-me" class="hidden" style="margin-bottom:10px"></div>
      <div class="hint" id="b-formhint" style="margin-bottom:10px">第一次到本院看診請先填寫資料；抵達診所後仍須持健保卡到櫃檯掛號，並告知已填妥線上初診單。身分證與出生年月日用於 LINE 綁定核對，在 LINE 內填寫會一併完成綁定，之後可收到提醒與看診號碼。</div>
      <div class="fld"><label>院區 <b>*</b></label><select id="b-clinic" onchange="S.slots=null"></select></div>
      <div class="fld"><label>姓名 <b>*</b></label><input id="b-name" name="name" autocomplete="name" placeholder="請輸入本名" maxlength="20"></div>
      <div class="fld"><label>身分證字號 <b>*</b></label><input id="b-pid" name="pid" autocomplete="off" placeholder="A123456789" maxlength="10" autocapitalize="characters" oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'');pidHint(this)"><div class="hint" id="b-pid-hint"></div></div>
      <div class="row2">
        <div class="fld"><label>出生年月日（民國）<b>*</b></label><input id="b-birth" name="bday" autocomplete="bday" inputmode="numeric" placeholder="0680913" maxlength="10" oninput="this.value=this.value.replace(/[^0-9\/]/g,'')" onblur="birthTidy()"><div class="hint">例：68年9月13日 → 0680913</div></div>
        <div class="fld"><label>手機號碼 <b>*</b></label><input id="b-phone" name="tel" type="tel" autocomplete="tel-national" inputmode="numeric" placeholder="0912345678" maxlength="13" oninput="phoneTidy(this)" onblur="phoneTidy(this)"></div>
      </div>
      <div class="fld"><label>通訊地址 <b>*</b></label><input id="b-address" name="address" autocomplete="street-address" placeholder="例：新北市鶯歌區國慶街167號" maxlength="100"></div>
      <label class="ck" id="b-consent-row" style="display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.6;margin:4px 0 8px"><input type="checkbox" id="b-consent" style="margin-top:5px"><span>我同意金鶯診所將我的 LINE 帳號與病歷資料連結，用於預約提醒、候診叫號、衛教與滿意度調查等通知（個人資料僅供本診所醫療服務使用）。</span></label>
      <input id="hp" class="hp" tabindex="-1" autocomplete="off">
      <div id="b-err" class="err hidden"></div>
      <button type="button" class="btn" id="b-next" onclick="submitFirstForm()">送出初診單</button>
    </form>
  </div>

  <div id="v-fdone" class="hidden">
    <div class="card"><h2 style="color:var(--ok)">✅ 初診資料已送出</h2>
      <div class="okbox" id="fd-line"></div>
      <div class="hint" style="margin-top:12px">抵達診所後請持<b>健保卡</b>至櫃檯掛號，並告知已填妥線上初診單，方便人員核對。</div>
      <a class="btn amb" id="fd-tel" href="#" style="text-decoration:none;text-align:center;margin-top:14px">📞 撥打院區電話</a>
      <a class="link" href="#" onclick="location.reload();return false">再填一位</a></div>
  </div>

  <div class="foot">金鶯診所 Elite Clinic · 本頁僅供初診資料填寫，資料僅用於掛號聯繫</div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
// ===== 設定 =====
var API = 'https://script.google.com/macros/s/AKfycby0VcU__CbiQqa0sM_q_iXc5BwWS4Wb00ivQiOprhapTYWauxu8M0xvG08hXtgDudBIXQ/exec';
var LIFF_ID = '2011961586-fgGbGa4B'; // LINE Developers → 同一個 LINE Login channel → 新增一個 LIFF（Endpoint URL 填本頁網址 first.html）→ 把 LIFF ID 貼這裡

var S = { cfg:null, idToken:'', accessToken:'', uid:'', inLine:false };
function $(id){ return document.getElementById(id); }
function showErr(id, msg){ var el = $(id); el.textContent = msg || ''; el.classList.toggle('hidden', !msg); }
function busy(btn, on, txt){ btn.disabled = on; if (on) { btn.dataset.t = btn.innerHTML; btn.innerHTML = '<span class="spin"></span>' + (txt || '處理中…'); } else if (btn.dataset.t) btn.innerHTML = btn.dataset.t; }
function pidValid(pid) {
  pid = String(pid || '').toUpperCase().trim();
  if (!/^[A-Z][A-D0-9]\d{8}$/.test(pid)) return false;
  var map = { A:10,B:11,C:12,D:13,E:14,F:15,G:16,H:17,I:34,J:18,K:19,L:20,M:21,N:22,O:35,P:23,Q:24,R:25,S:26,T:27,U:28,V:29,W:32,X:30,Y:31,Z:33 };
  var n1 = map[pid[0]], d = [Math.floor(n1 / 10), n1 % 10];
  var c2 = pid[1]; if (/[A-D]/.test(c2)) { var v = map[c2] % 10; d.push(v); } else d.push(+c2); // 新式居留證：A→0 B→1 C→2 D→3
  for (var i = 2; i < 10; i++) d.push(+pid[i]);
  var w = [1,9,8,7,6,5,4,3,2,1,1], sum = 0; for (var j = 0; j < 11; j++) sum += d[j] * w[j];
  return sum % 10 === 0;
}
function pidHint(el){ var h = $('b-pid-hint'); if (!h) return; var v = el.value; if (v.length < 10) { h.textContent = ''; el.style.borderColor = ''; return; } var ok = pidValid(v); h.textContent = ok ? '✓ 格式正確' : '✕ 檢查碼不正確，請再確認'; h.style.color = ok ? '#1E7F5C' : '#C0392B'; el.style.borderColor = ok ? '' : '#C0392B'; }
function phoneTidy(el){ var v = String(el.value || '').replace(/^\+?886/, '0').replace(/[^0-9]/g, ''); if (v.length > 10) v = v.slice(0, 10); if (el.value !== v) el.value = v; }
function birthTidy(){ var el = $('b-birth'), m = el.value.match(/^(\d{4})[\/\-.]?(\d{2})[\/\-.]?(\d{2})$/); if (m && +m[1] > 1911) { el.value = String(+m[1] - 1911).padStart(3, '0') + '/' + m[2] + '/' + m[3]; return; } var v = el.value.replace(/\D/g, ''); if (v.length === 7) el.value = v.slice(0,3) + '/' + v.slice(3,5) + '/' + v.slice(5); else if (v.length === 6) el.value = '0' + v.slice(0,2) + '/' + v.slice(2,4) + '/' + v.slice(4); }
function telLink(a, phone){ if (phone) { a.href = 'tel:' + phone.replace(/[^\d+]/g, ''); a.textContent = '📞 撥打院區電話 ' + phone; a.classList.remove('hidden'); } else a.classList.add('hidden'); }
function esc(t){ return String(t == null ? '' : t).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }
function api(params, cb, btn, txt) {
  if (btn) busy(btn, true, txt);
  params._ = Date.now();
  var run = function(attempt) {
    fetch(API, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(params), redirect:'follow' })
      .then(function(r){ return r.text(); }).then(function(t){ var d; try { d = JSON.parse(t); } catch (e) { if (attempt < 3) return setTimeout(function(){ run(attempt+1); }, 1200 * attempt); d = { error:'伺服器暫時忙碌，請稍後再試' }; } if (btn) busy(btn, false); cb(d); })
      .catch(function(e){ if (attempt < 3) return setTimeout(function(){ run(attempt+1); }, 1200 * attempt); if (btn) busy(btn, false); cb({ error:'連線失敗：' + e.message }); });
  };
  run(1);
}

// ===== LIFF =====
(function initLiff() {
  var st = $('liff-state');
  if (!window.liff) { st.textContent = 'LINE SDK 載入失敗，仍可送出初診單，但不會綁定 LINE。'; return; }
  if (LIFF_ID === 'PASTE_LIFF_ID') { st.textContent = '提示：從金鶯診所 LINE 官方帳號開啟本頁，填完會一併完成 LINE 綁定。'; return; }
  liff.init({ liffId: LIFF_ID }).then(function() {
    S.inLine = liff.isInClient();
    if (!liff.isLoggedIn()) { if (S.inLine) { liff.login(); return; } st.textContent = '提示：從金鶯診所 LINE 官方帳號開啟本頁並登入，填完會一併完成 LINE 綁定。'; return; }
    S.idToken = liff.getIDToken() || ''; S.accessToken = liff.getAccessToken() || '';
    var okMsg = function(name){ st.innerHTML = '✓ 已連結 LINE' + (name ? '（' + name + '）' : '') + '，送出後會一併完成 LINE 綁定'; };
    liff.getProfile().then(function(p){ S.uid = p.userId; okMsg(p.displayName); }).catch(function(){ okMsg(''); });
    loadMe();
  }).catch(function(e){ st.textContent = 'LINE 連線失敗（' + (e && e.message || e) + '），仍可送出初診單，但不會綁定 LINE。'; });
})();

// ===== 院區清單 =====
api({ action:'pubConfig' }, function(d) {
  if (d.error) { $('notice').textContent = d.error; $('notice').classList.remove('hidden'); return; }
  S.cfg = d; var list = d.allClinics || []; // 初診單＝全部啟用院區，與「網路預約」開放哪些院區無關（那是 d.clinics）
  if (!list.length) { $('notice').textContent = '院區清單載入失敗（後端版本過舊，請更新 Code.gs）'; $('notice').classList.remove('hidden'); }
  $('b-clinic').innerHTML = list.map(function(c){ return '<option value="' + c.code + '">' + c.name + '院區</option>'; }).join('');
});

// 自動帶入：(1) 這支 LINE 已綁過的人（家人或自己）→ 手機／姓名／身分證／生日可一鍵帶入；(2) 這支手機上次填過的手機與地址（localStorage）
function loadMe() {
  if ((!S.idToken && !S.accessToken) || S.meLoaded) return; S.meLoaded = true;
  api({ action:'pubMe', idToken: S.idToken, accessToken: S.accessToken }, function(d) {
    if (!d.people || !d.people.length) return; S.me = d.people;
    var box = $('ff-me'); box.classList.remove('hidden');
    box.innerHTML = '<div class="hint">您的 LINE 已綁定：' + d.people.map(function(x, i){ return '<button type="button" class="btn sec" style="margin:6px 6px 0 0;width:auto;padding:8px 12px;font-size:14px" onclick="pickMe(' + i + ')">' + esc(x.name || '') + ' ' + esc(x.pidMasked) + '</button>'; }).join('') + '<br>點一下可帶入資料（替家人填初診單請直接輸入）</div>';
    if (d.people.length === 1 && !$('b-phone').value) { $('b-phone').value = d.people[0].phone || ''; }
  }, null, '');
}
function pickMe(i) { var x = S.me[i]; if (!x) return; if (x.name) $('b-name').value = x.name; $('b-pid').value = x.pid; pidHint($('b-pid')); if (x.birth) $('b-birth').value = x.birth; if (x.phone) $('b-phone').value = x.phone; if (x.clinicCode) { var sel = $('b-clinic'); for (var k = 0; k < sel.options.length; k++) if (sel.options[k].value === x.clinicCode) sel.value = x.clinicCode; } }
(function restoreLast() { try { var v = JSON.parse(localStorage.getItem('ffLast') || 'null'); if (!v) return; if (v.phone && !$('b-phone').value) $('b-phone').value = v.phone; if (v.address && !$('b-address').value) $('b-address').value = v.address; } catch (e) {} })();
function saveLast(f) { try { localStorage.setItem('ffLast', JSON.stringify({ phone: f.phone, address: f.address })); } catch (e) {} }
function formData() {
  birthTidy();
  return { clinicCode: $('b-clinic').value, name: $('b-name').value.trim(), pid: $('b-pid').value.trim(), birth: $('b-birth').value.trim(), phone: $('b-phone').value.trim(), address: $('b-address').value.trim(),
           hp: $('hp').value, idToken: S.idToken, accessToken: S.accessToken };
}
function submitFirstForm() {
  var f = formData(); showErr('b-err', '');
  if (!f.clinicCode) return showErr('b-err', '請選擇院區');
  if (!f.name) return showErr('b-err', '請輸入姓名');
  if (!/^[A-Z][A-D0-9]\d{8}$/.test(f.pid)) return showErr('b-err', '身分證字號格式不正確'); if (!pidValid(f.pid)) return showErr('b-err', '身分證字號檢查碼不正確，請再確認一次');
  if (!/^\d{3}\/\d{2}\/\d{2}$/.test(f.birth)) return showErr('b-err', '出生年月日請以民國年輸入 7 碼數字，例：0680913');
  if (!/^09\d{8}$/.test(f.phone)) return showErr('b-err', '請輸入 10 碼手機號碼');
  if (!f.address) return showErr('b-err', '請輸入通訊地址');
  if (S.idToken && !$('b-consent').checked) return showErr('b-err', '請勾選同意將 LINE 帳號與病歷連結，才能為您綁定並發送提醒');
  f.action = 'pubFirstForm'; f.consent = $('b-consent').checked ? '1' : '';
  api(f, function(d) {
    if (d.error) return showErr('b-err', d.error);
    saveLast(f);
    $('fd-line').innerHTML = d.bound ? '✓ 已完成 LINE 綁定，之後看診提醒與看診號碼會傳到您的 LINE。' : '未完成 LINE 綁定（' + esc(d.bindNote || '') + '）。從金鶯診所 LINE 官方帳號開啟本頁填寫即可綁定。';
    telLink($('fd-tel'), d.phone); $('v-form').classList.add('hidden'); $('v-fdone').classList.remove('hidden'); window.scrollTo(0, 0);
  }, $('b-next'), '送出中…');
}
</script>
</body>
</html>
